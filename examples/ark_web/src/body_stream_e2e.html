<!doctype html>
<html>
<body>
<h1>Hello from custom protocol (rust)</h1>
<pre id="body-results">Body tests have not started.</pre>
<script>
window.bodyE2EStatus = "idle";
window.runBodyStreamTests = async function () {
  window.bodyE2EStatus = "running";
  const passed = [];
  async function check(name, upload, expected, streaming = false) {
    const response = await fetch("custom://demo/body/" + name, {
      method: "POST",
      body: upload,
      ...(streaming ? { duplex: "half" } : {})
    });
    if (!response.ok) throw new Error(name + ": HTTP " + response.status + " " + await response.text());
    const actual = new Uint8Array(await response.arrayBuffer());
    if (actual.length !== expected.length) {
      throw new Error(name + ": length " + actual.length + " expected " + expected.length);
    }
    for (let i = 0; i < actual.length; i++) {
      if (actual[i] !== expected[i]) throw new Error(name + ": byte mismatch at " + i);
    }
    passed.push(name + "=" + actual.length);
    document.getElementById("body-results").textContent = passed.join("\n");
  }
  try {
    const small = new Uint8Array([0, 1, 2, 127, 128, 254, 255, 32, 65, 90, 0]);
    await check("binary", small, small);
    await check("partial", small, small);
    const large = new Uint8Array(1024 * 1024 + 37);
    for (let i = 0; i < large.length; i++) large[i] = i % 251;
    await check("large", large, large);
    await check("blob", new Blob([large]), large);
    await check("empty", new Uint8Array(0), new Uint8Array(0));
    const chunkSizes = [1, 7, 65539, 3, 131071, 257, 1048589];
    const streamed = new Uint8Array(chunkSizes.reduce((sum, size) => sum + size, 0));
    for (let i = 0; i < streamed.length; i++) streamed[i] = (i * 17 + 23) % 251;
    function uploadStream() {
      let index = 0;
      let offset = 0;
      return new ReadableStream({
        async pull(controller) {
          // Produce each chunk later, with no content length or prebuilt Blob.
          await new Promise(resolve => setTimeout(resolve, 100));
          if (index === chunkSizes.length) {
            console.info("ark-web-upload: close bytes=" + offset);
            controller.close();
            return;
          }
          const size = chunkSizes[index++];
          const chunk = new Uint8Array(size);
          for (let i = 0; i < size; i++) chunk[i] = ((offset + i) * 17 + 23) % 251;
          offset += size;
          console.info("ark-web-upload: chunk=" + size + " total=" + offset);
          controller.enqueue(chunk);
        }
      });
    }
    await check("chunked", uploadStream(), streamed, true);
    await check("chunked-reads", uploadStream(), streamed, true);
    window.bodyE2EStatus = "pass:" + passed.join(",");
  } catch (error) {
    window.bodyE2EStatus = "fail:" + String(error);
    document.getElementById("body-results").textContent = window.bodyE2EStatus;
  }
};
</script>
</body>
</html>
