fail_fast                  = true
default_install_hook_types = ["pre-commit"]
default_stages             = ["pre-commit"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id   = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id      = "check-json"
exclude = '^\.zed/.*\.json$'

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id   = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id   = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev  = "v1.42.1"

[[repos.hooks]]
id   = "typos"
args = ["--force-exclude"]

[[repos]]
repo = "local"

[[repos.hooks]]
id             = "cargo-fmt"
name           = "cargo fmt"
language       = "system"
entry          = "pnpm run format:rust:check"
files          = '(^|/)(Cargo\.toml|.*\.rs)$'
pass_filenames = false

[[repos.hooks]]
id             = "taplo-format"
name           = "taplo format"
language       = "system"
entry          = "pnpm run format:toml:check"
files          = '\.toml$'
pass_filenames = false

[[repos.hooks]]
id             = "oxk-format"
name           = "oxk format"
language       = "system"
entry          = "pnpm run format:ui"
files          = '^examples-ui/.*\.ets$'
pass_filenames = false

[[repos.hooks]]
id             = "oxk-lint"
name           = "oxk lint"
language       = "system"
entry          = "pnpm run lint:ui"
files          = '^examples-ui/.*\.ets$'
pass_filenames = false

[[repos.hooks]]
id             = "no-generated-ui-artifacts"
name           = "block generated UI artifacts"
language       = "system"
entry          = "bash -c 'git diff --cached --name-only --diff-filter=ACM | grep -E \"^examples-ui/(entry/libs/|entry/src/main/ets/types/)\" && { echo \"Do not commit generated .so/d.ts artifacts; run pnpm ui:sync instead\" >&2; exit 1; } || true'"
pass_filenames = false
always_run     = true

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-useless-excludes"
