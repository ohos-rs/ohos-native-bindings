name: PR Lint and Format

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-lint-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crate-features:
    name: Crate features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: publish defaults
            args: ""
          - name: aarch64 API levels
            args: --target aarch64-unknown-linux-ohos --all-api-levels --lint
          - name: armv7 API levels
            args: --target armv7-unknown-linux-ohos --all-api-levels --lint
          - name: x86_64 API levels
            args: --target x86_64-unknown-linux-ohos --all-api-levels --lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "7.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check crates independently
        run: node tools/check-crate-features.mjs ${{ matrix.args }}

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: "7.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace tools
        run: pnpm install --frozen-lockfile

      - name: Check workspace configuration and UI
        run: |
          pnpm run prek:validate
          pnpm run format:toml:check
          pnpm run format:ui
          git diff --exit-code
          pnpm run lint:ui

      - name: Check Rust
        run: cargo fmt --check
