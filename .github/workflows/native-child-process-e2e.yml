name: PR Native child-process 2in1 E2E

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: pr-native-child-process-2in1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-child-process-2in1:
    name: Native child process 2in1 QEMU E2E
    uses: ./.github/workflows/qemu-e2e.yml
    with:
      name: Native child process 2in1
      suite: native_child_process
      device_type: 2in1
      release_tag: v20260919
      modules: native_child_process
