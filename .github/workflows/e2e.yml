name: PR E2E

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bindings-qemu:
    name: ${{ matrix.name }} QEMU E2E
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Non-UI bindings
            suite: bindings
            # Keep modules without validated QEMU runtime coverage in the
            # x64 build coverage. Upgrading the image does not enable their
            # E2E suites automatically.
            build_modules: >-
              ability_access_control ark_web arkui_input ashmem asset bundle camera display
              display_soloist drawing fileshare fileuri hilog huks image image_native ime init
              jsvm native_buffer native_window net_connection net_stack pasteboard qos raw sensor
              udmf vibrator vsync
            modules: >-
              ability_access_control ark_web arkui_input ashmem asset bundle camera display
              display_soloist drawing fileshare fileuri hilog huks image image_native ime init
              native_buffer native_window net_connection net_stack pasteboard raw sensor udmf vsync
            unsupported_modules: jsvm qos vibrator
          - name: ArkUI
            suite: arkui
            modules: arkui
          - name: XComponent
            suite: xcomponent
            modules: xcomponent
          - name: Accessibility
            suite: accessibility
            modules: accessibility
    uses: ./.github/workflows/qemu-e2e.yml
    with:
      name: ${{ matrix.name }}
      suite: ${{ matrix.suite }}
      device_type: phone
      modules: ${{ matrix.modules }}
      build_modules: ${{ matrix.build_modules || matrix.modules }}
      unsupported_modules: ${{ matrix.unsupported_modules || '' }}
