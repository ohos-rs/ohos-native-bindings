[package]
name        = "ohos-window-manager-binding"
version     = "0.1.1"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Safe OpenHarmony window manager bindings for Rust"

[dependencies]
ohos-enum-derive               = { workspace = true }
ohos-image-native-binding      = { workspace = true }
ohos-native-window-manager-sys = { workspace = true }
ohos-multi-modal-input-sys     = { workspace = true, optional = true }

[features]
default = []
api-13 = [
  "ohos-native-window-manager-sys/api-13",
  "ohos-image-native-binding/api-13",
  "ohos-multi-modal-input-sys?/api-13",
]
api-14 = [
  "api-13",
  "ohos-native-window-manager-sys/api-14",
  "ohos-image-native-binding/api-14",
  "ohos-multi-modal-input-sys?/api-14",
]
api-15 = [
  "api-14",
  "ohos-native-window-manager-sys/api-15",
  "dep:ohos-multi-modal-input-sys",
  "ohos-multi-modal-input-sys?/api-15",
  "ohos-image-native-binding/api-15",
]
api-16 = [
  "api-15",
  "ohos-native-window-manager-sys/api-16",
  "ohos-image-native-binding/api-16",
  "ohos-multi-modal-input-sys?/api-16",
]
api-17 = [
  "api-16",
  "ohos-native-window-manager-sys/api-17",
  "ohos-image-native-binding/api-17",
  "ohos-multi-modal-input-sys?/api-17",
]
api-18 = [
  "api-17",
  "ohos-native-window-manager-sys/api-18",
  "ohos-image-native-binding/api-18",
  "ohos-multi-modal-input-sys?/api-18",
]
api-19 = [
  "api-18",
  "ohos-native-window-manager-sys/api-19",
  "ohos-image-native-binding/api-19",
  "ohos-multi-modal-input-sys?/api-19",
]
api-20 = [
  "api-19",
  "ohos-native-window-manager-sys/api-20",
  "ohos-image-native-binding/api-20",
  "ohos-multi-modal-input-sys?/api-20",
]
api-21 = [
  "api-20",
  "ohos-native-window-manager-sys/api-21",
  "ohos-image-native-binding/api-21",
  "ohos-multi-modal-input-sys?/api-21",
]
api-22 = [
  "api-21",
  "ohos-native-window-manager-sys/api-22",
  "ohos-image-native-binding/api-22",
  "ohos-multi-modal-input-sys?/api-22",
]
api-23 = [
  "api-22",
  "ohos-native-window-manager-sys/api-23",
  "ohos-image-native-binding/api-23",
  "ohos-multi-modal-input-sys?/api-23",
]
api-24 = [
  "api-23",
  "ohos-native-window-manager-sys/api-24",
  "ohos-image-native-binding/api-24",
  "ohos-multi-modal-input-sys?/api-24",
]
api-25 = ["api-24", "ohos-native-window-manager-sys/api-25", "ohos-multi-modal-input-sys?/api-25"]
api-26 = ["api-25", "ohos-native-window-manager-sys/api-26", "ohos-multi-modal-input-sys?/api-26"]

[lints]
workspace = true
