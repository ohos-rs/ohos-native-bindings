[package]
name          = "ohos-multi-modal-input-sys"
version       = "0.1.1"
edition       = "2021"
license       = "MIT OR Apache-2.0"
description   = "Raw OpenHarmony multimodal InputKit bindings for Rust"
repository    = "https://github.com/ohos-rs/ohos-native-bindings"
documentation = "https://docs.rs/ohos-multi-modal-input-sys"
readme        = "README.md"

[dependencies]
ohos-image-native-sys = { workspace = true }

[features]
default = []
api-13  = []
api-14  = ["api-13"]
api-15  = ["api-14"]
api-16  = ["api-15"]
api-17  = ["api-16"]
api-18  = ["api-17"]
api-19  = ["api-18"]
api-20  = ["api-19"]
api-21  = ["api-20"]
api-22  = ["api-21"]
api-23  = ["api-22"]
api-24  = ["api-23"]
api-25  = ["api-24"]
api-26  = ["api-25"]

[lints]
workspace = true
